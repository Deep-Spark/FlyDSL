name: ci-device

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: true
        type: string
      force_run:
        description: "Reserved for later full ci-device rollout"
        required: false
        type: boolean
        default: false
      reason:
        description: "Why manual run is requested"
        required: false
        type: string
        default: ""

permissions: read-all

jobs:
  required:
    name: ci-device / required
    runs-on: ubuntu-latest
    steps:
      - name: Registration placeholder
        run: |
          {
            echo "### ci-device (bootstrap mode)"
            echo ""
            echo "- status: registered"
            echo "- note: this is a temporary workflow for Actions registration only."
            echo "- ref: ${{ inputs.ref }}"
            echo "- force_run: ${{ inputs.force_run }}"
            echo "- reason: ${{ inputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
