name: perf-daily-iluvatar

on:
  schedule:
    # 02:00 Asia/Shanghai == 18:00 UTC (previous day)
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run is requested"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-daily-iluvatar-iluvatar
  cancel-in-progress: false

jobs:
  trend:
    name: perf-trend (working only)
    runs-on: [self-hosted, linux, x64, iluvatar-gpu]
    timeout-minutes: 240
    env:
      PERF_BRANCH: iluvatar
      PERF_WARMUP: "5"
      PERF_ITERS: "15"
      PERF_MAJOR_PATTERN: nt
      PERF_EPILOGUE: no_c_read
      PERF_EPILOGUE_STORE: shfl
      PERF_K_REP: "2"
      PERF_SHAPES: "1024x1024x1024,2048x2048x2048,4096x4096x4096"
      COREX_ROOT: ${{ vars.COREX_ROOT || '/home/flydsl/sw_home/local/corex' }}
      IXCC_WORKING_ROOT: ${{ vars.IXCC_WORKING_ROOT || '' }}
      IXSDK_WORKING_ROOT: ${{ vars.IXSDK_WORKING_ROOT || '' }}
      IX_TOOLCHAIN_DAILY_STATE_FILE: ${{ vars.IX_TOOLCHAIN_DAILY_STATE_FILE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PERF_BRANCH }}

      - name: Daily update IXCC/IXSDK from working
        id: ix-toolchain
        continue-on-error: true
        run: |
          args=()
          if [[ -n "${IXCC_WORKING_ROOT}" ]]; then
            args+=(--ixcc-root "${IXCC_WORKING_ROOT}")
          fi
          if [[ -n "${IXSDK_WORKING_ROOT}" ]]; then
            args+=(--ixsdk-root "${IXSDK_WORKING_ROOT}")
          fi
          if [[ -n "${IX_TOOLCHAIN_DAILY_STATE_FILE}" ]]; then
            args+=(--state-file "${IX_TOOLCHAIN_DAILY_STATE_FILE}")
          fi
          bash .github/scripts/prepare_ix_toolchains_daily.sh "${args[@]}"

      - name: Fetch previous metrics marker from last successful run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import re
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GITHUB_TOKEN", "")
          branch = os.environ.get("PERF_BRANCH", "iluvatar")
          run_id = int(os.environ["GITHUB_RUN_ID"])
          workflow_file = "perf-daily-iluvatar.yml"

          out_dir = Path(".perf")
          out_dir.mkdir(parents=True, exist_ok=True)
          prev_file = out_dir / "previous_metrics.json"

          if not token:
              print("No GITHUB_TOKEN; skip previous metrics lookup.")
              raise SystemExit(0)

          def api_get(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.read()

          runs_url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/{workflow_file}/runs"
              f"?branch={branch}&status=completed&per_page=20"
          )
          runs_payload = json.loads(api_get(runs_url).decode("utf-8"))
          runs = runs_payload.get("workflow_runs", [])

          candidate = None
          for r in runs:
              rid = int(r.get("id", 0))
              if rid == run_id:
                  continue
              if r.get("conclusion") != "success":
                  continue
              candidate = rid
              break

          if candidate is None:
              print("No previous successful run found.")
              raise SystemExit(0)

          logs_url = f"https://api.github.com/repos/{repo}/actions/runs/{candidate}/logs"
          raw_zip = api_get(logs_url)
          marker_re = re.compile(r"^PERF_METRIC_JSON=(\{.*\})$")
          found = None

          with zipfile.ZipFile(io.BytesIO(raw_zip)) as zf:
              for name in zf.namelist():
                  try:
                      content = zf.read(name).decode("utf-8", errors="replace")
                  except Exception:
                      continue
                  for line in content.splitlines():
                      m = marker_re.match(line.strip())
                      if not m:
                          continue
                      try:
                          found = json.loads(m.group(1))
                      except json.JSONDecodeError:
                          continue
              if found is None:
                  print(f"No PERF_METRIC_JSON marker found in run {candidate} logs.")
                  raise SystemExit(0)

          prev_file.write_text(json.dumps(found, ensure_ascii=True, indent=2), encoding="utf-8")
          print(f"Loaded previous metrics from run {candidate}.")
          PY

      - name: Build working toolchains and run HGEMM perf trend probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IX_TOOLCHAIN_OUTCOME: ${{ steps.ix-toolchain.outcome }}
          IXCC_COMMIT: ${{ steps.ix-toolchain.outputs.ixcc_commit }}
          IXSDK_COMMIT: ${{ steps.ix-toolchain.outputs.ixsdk_commit }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          def git_short(path):
              p = subprocess.run(
                  ["git", "rev-parse", "--short", "HEAD"],
                  cwd=path,
                  text=True,
                  capture_output=True,
              )
              if p.returncode == 0:
                  return p.stdout.strip()
              return "unknown"

          def parse_tflops(output):
              # Example:
              # [bench] ... 123.4 us/iter  101.23 TFLOPS  (torch ...)
              m = re.findall(r"\[bench\].*?([0-9]+(?:\.[0-9]+)?)\s+TFLOPS\s+\(torch", output)
              if not m:
                  return None
              return float(m[-1])

          start_ts = int(time.time())
          repo_root = Path(".").resolve()
          perf_dir = repo_root / ".perf"
          perf_dir.mkdir(parents=True, exist_ok=True)
          result_file = perf_dir / "result.json"
          prev_file = perf_dir / "previous_metrics.json"

          result = {
              "status": "ok",
              "invalid_reason": "",
              "flydsl_commit": git_short(repo_root),
              "ixcc_commit": os.environ.get("IXCC_COMMIT", "unknown"),
              "ixsdk_commit": os.environ.get("IXSDK_COMMIT", "unknown"),
              "config": {
                  "branch": os.environ.get("PERF_BRANCH", "iluvatar"),
                  "major_pattern": os.environ.get("PERF_MAJOR_PATTERN", "nt"),
                  "epilogue": os.environ.get("PERF_EPILOGUE", "no_c_read"),
                  "epilogue_store": os.environ.get("PERF_EPILOGUE_STORE", "shfl"),
                  "k_rep": int(os.environ.get("PERF_K_REP", "2")),
                  "warmup": int(os.environ.get("PERF_WARMUP", "5")),
                  "iters": int(os.environ.get("PERF_ITERS", "15")),
                  "shapes": os.environ.get("PERF_SHAPES", ""),
              },
              "metrics": {},
              "delta_vs_prev_pct": {},
              "timestamp": start_ts,
          }

          previous = None
          if prev_file.exists():
              try:
                  previous = json.loads(prev_file.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  previous = None

          corex_root = Path(os.environ["COREX_ROOT"])

          def invalidate(reason):
              result["status"] = "invalid_sample"
              result["invalid_reason"] = reason

          if not corex_root.is_dir():
              invalidate(f"COREX_ROOT not found: {corex_root}")
          if result["status"] == "ok" and os.environ.get("IX_TOOLCHAIN_OUTCOME") != "success":
              invalidate("ix toolchain refresh failed")

          if result["status"] == "ok":
              env = os.environ.copy()
              env["PATH"] = f"{corex_root}/bin:" + env.get("PATH", "")
              env["LD_LIBRARY_PATH"] = f"{corex_root}/lib64:{corex_root}/lib:" + env.get("LD_LIBRARY_PATH", "")
              env["FLYDSL_COMPILE_BACKEND"] = "iluvatar"
              env["FLYDSL_RUNTIME_KIND"] = "iluvatar"
              env["ARCH"] = "ivcore11"
              env["FLYDSL_RUNTIME_ENABLE_CACHE"] = "0"
              env["PYTHONUNBUFFERED"] = "1"

              shape_specs = [s.strip() for s in result["config"]["shapes"].split(",") if s.strip()]
              for spec in shape_specs:
                  m, n, k = spec.split("x")
                  cmd = [
                      "python3",
                      "examples/03-tiledMma-iluvatar-mr-pipeline-hgemm.py",
                      "--bench",
                      "--epilogue",
                      result["config"]["epilogue"],
                      "--epilogue-store",
                      result["config"]["epilogue_store"],
                      "--major-pattern",
                      result["config"]["major_pattern"],
                      "--k-rep",
                      str(result["config"]["k_rep"]),
                      "--warmup",
                      str(result["config"]["warmup"]),
                      "--iters",
                      str(result["config"]["iters"]),
                      "--m",
                      m,
                      "--n",
                      n,
                      "--k",
                      k,
                  ]
                  print(f"$ {' '.join(cmd)}")
                  p = subprocess.run(cmd, text=True, capture_output=True, env=env)
                  if p.stdout:
                      print(p.stdout, end="")
                  if p.stderr:
                      print(p.stderr, end="")
                  if p.returncode != 0:
                      invalidate(f"bench failed for shape {spec}")
                      break
                  tflops = parse_tflops((p.stdout or "") + "\n" + (p.stderr or ""))
                  if tflops is None:
                      invalidate(f"unable to parse TFLOPS for shape {spec}")
                      break
                  result["metrics"][spec] = tflops

          if previous and isinstance(previous, dict):
              prev_metrics = previous.get("metrics", {})
              if isinstance(prev_metrics, dict):
                  for spec, cur in result["metrics"].items():
                      prev = prev_metrics.get(spec)
                      if isinstance(prev, (int, float)) and prev != 0:
                          result["delta_vs_prev_pct"][spec] = (cur - float(prev)) / float(prev) * 100.0

          result_file.write_text(json.dumps(result, ensure_ascii=True, indent=2), encoding="utf-8")
          print("PERF_METRIC_JSON=" + json.dumps(result, ensure_ascii=True))
          PY

      - name: Write performance summary
        env:
          INPUT_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(".perf/result.json").read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          lines = []
          lines.append("### Daily performance trend (Iluvatar)")
          lines.append("")
          lines.append(f"- mode: `trend-only` (non-blocking)")
          lines.append(f"- branch: `{result['config']['branch']}`")
          lines.append(f"- flydsl_commit: `{result.get('flydsl_commit','unknown')}`")
          lines.append(f"- ixcc_commit: `{result.get('ixcc_commit','unknown') or '<unknown>'}`")
          lines.append(f"- ixsdk_commit: `{result.get('ixsdk_commit','unknown') or '<unknown>'}`")
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              lines.append(f"- manual reason: `{os.environ.get('INPUT_REASON','')}`")
          lines.append("")

          if result["status"] != "ok":
              lines.append(f"- status: `invalid_sample`")
              lines.append(f"- reason: `{result.get('invalid_reason','unknown')}`")
              lines.append("")
          else:
              lines.append("| shape | TFLOPS | delta vs prev |")
              lines.append("|---|---:|---:|")
              for spec in sorted(result["metrics"]):
                  cur = result["metrics"][spec]
                  delta = result.get("delta_vs_prev_pct", {}).get(spec)
                  delta_text = "n/a" if delta is None else f"{delta:+.2f}%"
                  lines.append(f"| `{spec}` | `{cur:.2f}` | `{delta_text}` |")
              lines.append("")
              lines.append(
                  f"- bench config: pattern=`{result['config']['major_pattern']}`, "
                  f"epilogue=`{result['config']['epilogue']}`, "
                  f"store=`{result['config']['epilogue_store']}`, "
                  f"k_rep=`{result['config']['k_rep']}`, "
                  f"warmup=`{result['config']['warmup']}`, "
                  f"iters=`{result['config']['iters']}`"
              )

          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

