name: Publish Wheels (Iluvatar A-track)

# Two channels:
# - ci: push to iluvatar (ci-device path filters). Smoke tests only.
#   Ubuntu 20.04 cp312 by default (ixaite / glibc 2.31).
#   GitHub Release tag iluvatar-ci; local ${WHEEL_ROOT}/ci/ when staging is enabled.
# - weekly: Sunday / dispatch. Fuller device tests.
#   Ubuntu 20.04 (optional cp310/cp312, default cp312) and Ubuntu 24.04 cp312.
#   GitHub Release latest + local ${WHEEL_ROOT}/latest/ when staging is enabled.
# Optional local copies use vars.FLYDSL_ILUVATAR_WHEEL_DIR (unset skips staging).
# Runner paths/images/DNS come from repo vars only (no machine-local defaults).

on:
  push:
    branches:
      - iluvatar
  schedule:
    # Sunday 03:00 UTC == Sunday 11:00 Asia/Shanghai.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build (default iluvatar)"
        type: string
        required: false
        default: "iluvatar"
      u2004_python_versions:
        description: "Space-separated Ubuntu 20.04 python versions (default 3.12)"
        type: string
        required: false
        default: "3.12"
      docker_image:
        description: "Ignored. CI uses Ubuntu 20.04; weekly also builds Ubuntu 24.04 cp312."
        type: string
        required: false
        default: ""
      cmake_build_type:
        description: "FlyDSL CMake build type"
        type: choice
        required: false
        options:
          - Release
          - Debug
        default: Release
      package_kind:
        description: "ci: smoke-tested downstream CI wheel. weekly: fuller-tested formal wheel"
        type: choice
        required: false
        options:
          - weekly
          - ci
        default: weekly
      ixcc_ref:
        description: "u2004 fresh flow only: git ref inside ixcc.git (empty uses channel vars.IXCC_CI_REF / vars.IXCC_REF)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: publish-whl-iluvatar-${{ github.event_name == 'push' && 'ci' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'ci' && 'ci' || 'weekly') }}
  cancel-in-progress: true

jobs:
  gate:
    name: should-publish
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
      source_ref: ${{ steps.refs.outputs.source_ref }}
      channel: ${{ steps.gate.outputs.channel }}
      test_suite: ${{ steps.gate.outputs.test_suite }}
      local_name: ${{ steps.gate.outputs.local_name }}
      ixcc_ref: ${{ steps.gate.outputs.ixcc_ref }}
      ixcc_mlir_cmake: ${{ steps.gate.outputs.ixcc_mlir_cmake }}
      build_matrix: ${{ steps.gate.outputs.build_matrix }}
    steps:
      - name: Resolve source ref
        id: refs
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "source_ref=${{ inputs.source_ref || 'iluvatar' }}" >> "${GITHUB_OUTPUT}"
              ;;
            push)
              echo "source_ref=${{ github.sha }}" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "source_ref=iluvatar" >> "${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Decide whether this push needs a wheel
        id: decision
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/should_run_device.py --config .github/ci-config.yaml

      - name: Finalize gate
        id: gate
        env:
          U2004_IMAGE: ${{ vars.FLYDSL_ILUVATAR_U2004_IMAGE }}
          U2404_IMAGE: ${{ vars.FLYDSL_ILUVATAR_U2404_IMAGE }}
          U2004_PYTHON_VERSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.u2004_python_versions || '3.12' }}
          IXCC_MLIR_CMAKE: ${{ vars.IXCC_MLIR_CMAKE }}
          IXCC_CI_MLIR_CMAKE: ${{ vars.IXCC_CI_MLIR_CMAKE }}
          IXCC_REF: ${{ vars.IXCC_REF }}
          IXCC_CI_REF: ${{ vars.IXCC_CI_REF }}
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "${event}" = "push" ]; then
            channel=ci
            echo "should_run=${{ steps.decision.outputs.should_run }}" >> "${GITHUB_OUTPUT}"
            echo "reason=${{ steps.decision.outputs.reason }}" >> "${GITHUB_OUTPUT}"
          elif [ "${event}" = "workflow_dispatch" ] && [ "${{ inputs.package_kind }}" = "ci" ]; then
            channel=ci
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "reason=Manual Iluvatar CI wheel publish." >> "${GITHUB_OUTPUT}"
          else
            channel=weekly
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "reason=Scheduled or manual Iluvatar weekly wheel publish." >> "${GITHUB_OUTPUT}"
          fi
          if [ -z "${U2004_IMAGE}" ]; then
            echo "::error::vars.FLYDSL_ILUVATAR_U2004_IMAGE is required"
            exit 1
          fi
          if [ "${channel}" = "weekly" ] && [ -z "${U2404_IMAGE}" ]; then
            echo "::error::vars.FLYDSL_ILUVATAR_U2404_IMAGE is required for weekly builds"
            exit 1
          fi
          # Channel owns local staging dir + GitHub Release target:
          #   ci     -> ${WHEEL_ROOT}/ci/     + tag iluvatar-ci
          #   weekly -> ${WHEEL_ROOT}/latest/ + latest release
          if [ "${channel}" = "ci" ]; then
            local_name=ci
            default_ixcc_ref="${IXCC_CI_REF:-${IXCC_REF:-}}"
            ixcc_mlir_cmake="${IXCC_CI_MLIR_CMAKE:-${IXCC_MLIR_CMAKE:-}}"
          else
            local_name=latest
            default_ixcc_ref="${IXCC_REF:-}"
            ixcc_mlir_cmake="${IXCC_MLIR_CMAKE:-}"
          fi
          requested_ref="${{ github.event_name == 'workflow_dispatch' && inputs.ixcc_ref || '' }}"
          if [ -n "${requested_ref}" ]; then
            ixcc_ref="${requested_ref}"
          else
            ixcc_ref="${default_ixcc_ref}"
          fi
          # u2004 matrix entries always use_fresh_ixcc; fail here so an empty
          # IXCC_REF does not wait for the in-container : "${IXCC_REF:?...}".
          if [ -z "${ixcc_ref}" ]; then
            if [ "${channel}" = "ci" ]; then
              echo "::error::IXCC ref empty: set inputs.ixcc_ref or vars.IXCC_CI_REF / vars.IXCC_REF"
            else
              echo "::error::IXCC ref empty: set inputs.ixcc_ref or vars.IXCC_REF"
            fi
            exit 1
          fi
          echo "ixcc_ref=${ixcc_ref}" >> "${GITHUB_OUTPUT}"
          echo "ixcc_mlir_cmake=${ixcc_mlir_cmake}" >> "${GITHUB_OUTPUT}"
          echo "local_name=${local_name}" >> "${GITHUB_OUTPUT}"
          if [ "${channel}" = "ci" ]; then
            echo "channel=ci" >> "${GITHUB_OUTPUT}"
            echo "test_suite=smoke" >> "${GITHUB_OUTPUT}"
          else
            echo "channel=weekly" >> "${GITHUB_OUTPUT}"
            echo "test_suite=full" >> "${GITHUB_OUTPUT}"
          fi
          # Build matrix: one entry per (image, python_version).
          # u2004 always uses use_fresh_ixcc (runner host glibc vs corex-base
          # 20.04 mismatch). Fresh clones ixcc at ixcc_ref (vars / dispatch).
          # u2404 stays weekly-only and uses the host persistent tree via
          # ixcc_mlir_cmake.
          CHANNEL="${channel}" python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os

          channel = os.environ["CHANNEL"]
          u2004_image = os.environ["U2004_IMAGE"]
          u2004_versions = [v.strip() for v in os.environ["U2004_PYTHON_VERSIONS"].split() if v.strip()]

          matrix = []
          for ver in u2004_versions:
              cp = ver.replace(".", "")
              matrix.append(
                  {
                      "id": f"u2004-cp{cp}",
                      "python_versions": ver,
                      "docker_image": u2004_image,
                      "test_suite": "smoke",
                      "use_fresh_ixcc": True,
                  }
              )

          if channel == "weekly":
              matrix.append(
                  {
                      "id": "u2404-cp312",
                      "python_versions": "3.12",
                      "docker_image": os.environ["U2404_IMAGE"],
                      "test_suite": "full",
                      "use_fresh_ixcc": False,
                  }
              )

          if not matrix:
              raise SystemExit("u2004_python_versions produced an empty build matrix")

          print("build_matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY

      - name: Write gate summary
        run: |
          {
            echo "### Iluvatar wheel publish gate"
            echo
            echo "- event: \`${{ github.event_name }}\`"
            echo "- channel: \`${{ steps.gate.outputs.channel }}\`"
            echo "- source_ref: \`${{ steps.refs.outputs.source_ref }}\`"
            echo "- should_run: \`${{ steps.gate.outputs.should_run }}\`"
            echo "- test_suite: \`${{ steps.gate.outputs.test_suite }}\`"
            echo "- matrix: \`${{ steps.gate.outputs.build_matrix }}\`"
            echo "- reason: ${{ steps.gate.outputs.reason }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    needs: [gate]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.build_matrix) }}
    uses: ./.github/workflows/build-whl-iluvatar.yaml
    with:
      python_versions: ${{ matrix.python_versions }}
      docker_image: ${{ matrix.docker_image }}
      source_ref: ${{ needs.gate.outputs.source_ref }}
      artifact_name: flydsl-iluvatar-wheels-${{ matrix.id }}-${{ github.run_id }}
      ixcc_ref: ${{ needs.gate.outputs.ixcc_ref }}
      ixcc_mlir_cmake: ${{ needs.gate.outputs.ixcc_mlir_cmake }}
      use_fresh_ixcc: ${{ matrix.use_fresh_ixcc }}
      local_wheel_dir: ${{ vars.FLYDSL_ILUVATAR_WHEEL_DIR != '' && format('{0}/incoming-{1}-{2}', vars.FLYDSL_ILUVATAR_WHEEL_DIR, needs.gate.outputs.channel, matrix.id) || '' }}
      cmake_build_type: ${{ github.event_name == 'workflow_dispatch' && inputs.cmake_build_type || 'Release' }}
    permissions:
      contents: read
      packages: read

  test:
    needs: [gate, build]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run == 'true' && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.build_matrix) }}
    uses: ./.github/workflows/test-whl-iluvatar.yaml
    with:
      docker_image: ${{ matrix.docker_image }}
      python_versions: ${{ matrix.python_versions }}
      wheel_artifact_name: flydsl-iluvatar-wheels-${{ matrix.id }}-${{ github.run_id }}
      source_ref: ${{ needs.gate.outputs.source_ref }}
      suite: ${{ matrix.test_suite }}
    permissions:
      contents: read
      actions: read
      packages: read

  promote-local:
    needs: [gate, build, test]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run == 'true' && needs.test.result == 'success' && vars.FLYDSL_ILUVATAR_WHEEL_DIR != '' }}
    runs-on: [self-hosted, linux, x64, gpu-iluvatar]
    timeout-minutes: 10
    env:
      WHEEL_ROOT: ${{ vars.FLYDSL_ILUVATAR_WHEEL_DIR }}
      FLYDSL_ILUVATAR_WHEEL_ARTIFACT_DIR: ${{ vars.FLYDSL_ILUVATAR_WHEEL_ARTIFACT_DIR }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4

      - name: Promote incoming wheels to latest
        run: |
          set -euo pipefail
          channel="${{ needs.gate.outputs.channel }}"
          dest="${WHEEL_ROOT}/${{ needs.gate.outputs.local_name }}"
          merge="${WHEEL_ROOT}/incoming-${channel}-merged"
          shopt -s nullglob
          dirs=("${WHEEL_ROOT}/incoming-${channel}-"*)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No incoming wheel dirs under ${WHEEL_ROOT}/incoming-${channel}-*" >&2
            exit 1
          fi
          rm -rf "${merge}"
          mkdir -p "${merge}"
          for d in "${dirs[@]}"; do
            case "$(basename "${d}")" in
              incoming-${channel}-merged) continue ;;
            esac
            cp -a "${d}/." "${merge}/"
          done
          bash .github/scripts/promote_iluvatar_weekly_wheel_local.sh \
            "${merge}" \
            "${dest}"
          rm -rf "${merge}"
          if [[ -n "${FLYDSL_ILUVATAR_WHEEL_ARTIFACT_DIR:-}" && -d "${FLYDSL_ILUVATAR_WHEEL_ARTIFACT_DIR}" ]]; then
            bash .github/scripts/publish_iluvatar_wheel_artifacts.sh \
              "${dest}" \
              "${{ needs.gate.outputs.local_name }}"
          else
            echo "skip artifact HTTP publish: vars.FLYDSL_ILUVATAR_WHEEL_ARTIFACT_DIR unset or missing"
          fi

  publish:
    needs: [gate, build, test]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run == 'true' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flydsl-iluvatar-wheels-*-${{ github.run_id }}
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find dist -type f | sort
          bash .github/scripts/publish_iluvatar_weekly_release.sh dist \
            "${{ needs.gate.outputs.source_ref }}" \
            "${{ needs.gate.outputs.channel }}"

      - name: Write publish summary
        run: |
          {
            echo "### Iluvatar ${{ needs.gate.outputs.channel }} wheel"
            echo
            echo "- Source ref: \`${{ needs.gate.outputs.source_ref }}\`"
            echo "- Channel: \`${{ needs.gate.outputs.channel }}\`"
            echo "- URLs:"
            if [ "${{ needs.gate.outputs.channel }}" = "ci" ]; then
              echo "  - https://github.com/${{ github.repository }}/releases/download/iluvatar-ci/flydsl-iluvatar-cp312-manylinux_x86_64.whl"
            else
              echo "  - u2004 (default): https://github.com/${{ github.repository }}/releases/latest/download/flydsl-iluvatar-cp312-manylinux_x86_64.whl"
              echo "  - u2404: https://github.com/${{ github.repository }}/releases/latest/download/flydsl-iluvatar-u2404-cp312-manylinux_x86_64.whl"
              echo "  - (optional cp310 when built) https://github.com/${{ github.repository }}/releases/latest/download/flydsl-iluvatar-cp310-manylinux_x86_64.whl"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
