name: FlyDSL CI Wheels (Iluvatar A-track)

# Manual-only: do not schedule nightlies. Dispatch when a release wheel is needed.
# Runner paths/images/refs come from repo vars (same contract as build-whl-iluvatar).
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip wheel test stage"
        type: boolean
        default: false
      python_versions:
        description: "Space-separated python versions for wheel build"
        type: string
        default: "3.12"
      docker_image:
        description: "Iluvatar build/test image (empty uses vars.FLYDSL_ILUVATAR_U2004_IMAGE)"
        type: string
        default: ""
      cmake_build_type:
        description: "FlyDSL CMake build type"
        type: choice
        options:
          - Release
          - Debug
        default: Release
      ixcc_ref:
        description: "u2004 fresh flow: git ref inside ixcc.git (empty uses vars.IXCC_CI_REF or vars.IXCC_REF)"
        type: string
        default: ""
      ixcc_mlir_cmake:
        description: "Host MLIRConfig.cmake dir for persistent path (empty uses vars.IXCC_CI_MLIR_CMAKE or vars.IXCC_MLIR_CMAKE)"
        type: string
        default: ""
      use_fresh_ixcc:
        description: "u2004 only: clone+build IXCC in container (default true; host IXCC cannot run in corex-base-20.04)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-whl-iluvatar.yaml
    with:
      python_versions: ${{ inputs.python_versions || '3.12' }}
      docker_image: ${{ inputs.docker_image || vars.FLYDSL_ILUVATAR_U2004_IMAGE }}
      cmake_build_type: ${{ inputs.cmake_build_type || 'Release' }}
      ixcc_ref: ${{ inputs.ixcc_ref || vars.IXCC_CI_REF || vars.IXCC_REF }}
      ixcc_mlir_cmake: ${{ inputs.ixcc_mlir_cmake || vars.IXCC_CI_MLIR_CMAKE || vars.IXCC_MLIR_CMAKE }}
      use_fresh_ixcc: ${{ inputs.use_fresh_ixcc }}

  test:
    needs: build
    if: ${{ !(inputs.skip_tests || false) }}
    uses: ./.github/workflows/test-whl-iluvatar.yaml
    with:
      docker_image: ${{ inputs.docker_image || vars.FLYDSL_ILUVATAR_U2004_IMAGE }}
      wheel_artifact_name: ${{ needs.build.outputs.artifact_name }}
