name: FlyDSL CI Wheels (Iluvatar A-track)

# Manual-only: do not schedule nightlies. Dispatch when a release wheel is needed.
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip wheel test stage"
        type: boolean
        default: false
      python_versions:
        description: "Space-separated python versions for wheel build"
        type: string
        default: "3.12"
      docker_image:
        description: "Iluvatar build/test image"
        type: string
        default: "10.150.9.98:80/infra/corex_base/ubuntu:20.04-latest"
      cmake_build_type:
        description: "FlyDSL CMake build type"
        type: choice
        options:
          - Release
          - Debug
        default: Release
      ixcc_ref:
        description: "u2004 fresh flow: git ref inside ixcc.git (empty follows ixcc_variant)"
        type: string
        default: ""
      ixcc_variant:
        description: "Which IXCC tree to build against"
        type: choice
        options:
          - internal
          - external
        default: internal
      use_fresh_ixcc:
        description: "u2004 only: clone+build IXCC in container (default true; host IXCC cannot run in corex-base-20.04)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-whl-iluvatar.yaml
    with:
      python_versions: ${{ inputs.python_versions || '3.12' }}
      docker_image: ${{ inputs.docker_image || '10.150.9.98:80/infra/corex_base/ubuntu:20.04-latest' }}
      cmake_build_type: ${{ inputs.cmake_build_type || 'Release' }}
      ixcc_ref: ${{ inputs.ixcc_ref || (inputs.ixcc_variant == 'external' && 'origin/xiang.zhang/ixcc-flydsl-release' || 'origin/working') }}
      ixcc_variant: ${{ inputs.ixcc_variant || 'internal' }}
      use_fresh_ixcc: ${{ inputs.use_fresh_ixcc }}

  test:
    needs: build
    if: ${{ !(inputs.skip_tests || false) }}
    uses: ./.github/workflows/test-whl-iluvatar.yaml
    with:
      docker_image: ${{ inputs.docker_image || '10.150.9.98:80/infra/corex_base/ubuntu:20.04-latest' }}
      wheel_artifact_name: ${{ needs.build.outputs.artifact_name }}
