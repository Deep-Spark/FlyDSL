name: publish-iluvatar-ci-image

on:
  schedule:
    # 02:00 Asia/Shanghai == 18:00 UTC (previous day)
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Primary image tag"
        required: true
        default: "stable"
        type: string
      force_rebuild:
        description: "Force rebuild even if latest wheel is unavailable"
        required: false
        default: false
        type: boolean
      reason:
        description: "Reason for wheel URL/image publish change"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build-and-push
    runs-on: [self-hosted, linux, x64, gpu-iluvatar]
    env:
      TAG_INPUT: ${{ inputs.tag }}
      FORCE_REBUILD_INPUT: ${{ inputs.force_rebuild }}
      REASON_INPUT: ${{ inputs.reason }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest != '' && steps.build.outputs.digest || steps.build_retry.outputs.digest != '' && steps.build_retry.outputs.digest || steps.build_prev_torch.outputs.digest != '' && steps.build_prev_torch.outputs.digest || steps.fallback.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Derive image name
        id: meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/flydsl-iluvatar-ci"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Pre-flight secrets
        env:
          COREX_TORCH_WHEEL_URL: ${{ secrets.COREX_TORCH_WHEEL_URL }}
        run: |
          if [ -z "${COREX_TORCH_WHEEL_URL}" ]; then
            echo "::error::COREX_TORCH_WHEEL_URL is required (full wheel URL or base directory URL)"
            exit 1
          fi

      - name: Decide fallback rebuild mode
        id: rebuild_mode
        run: |
          set -euo pipefail
          force_rebuild="false"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${FORCE_REBUILD_INPUT}" = "true" ]; then
            force_rebuild="true"
          fi

          rebuild_with_prev_torch="false"
          if [ "${force_rebuild}" = "true" ]; then
            rebuild_with_prev_torch="true"
          fi

          echo "force_rebuild=${force_rebuild}" >> "${GITHUB_OUTPUT}"
          echo "rebuild_with_prev_torch=${rebuild_with_prev_torch}" >> "${GITHUB_OUTPUT}"

      - name: Resolve and verify CoreX torch wheel/md5
        id: wheel
        env:
          COREX_TORCH_WHEEL_URL: ${{ secrets.COREX_TORCH_WHEEL_URL }}
        run: |
          set -euo pipefail
          retry_download() {
            local url="$1"
            local out="$2"
            local n=0
            until [ "$n" -ge 3 ]; do
              if curl -fL --connect-timeout 15 --max-time 300 "$url" -o "$out"; then
                return 0
              fi
              n=$((n+1))
              sleep $((2**n))
            done
            return 1
          }

          input_url="${COREX_TORCH_WHEEL_URL}"
          wheel_url=""
          wheel_name=""

          if [[ "${input_url%%\?*}" == *.whl ]]; then
            wheel_url="${input_url}"
            wheel_path="${wheel_url%%\?*}"
            wheel_name="${wheel_path##*/}"
          else
            base_url="${input_url}"
            if [[ "${base_url}" != */ ]]; then
              base_url="${base_url}/"
            fi
            retry_download "${base_url}" /tmp/corex_wheel_index.html || {
              echo "::warning::failed to download wheel index: ${base_url}; fallback to previous successful image"
              echo "wheel_found=false" >> "${GITHUB_OUTPUT}"
              echo "fallback_reason=wheel_index_unavailable" >> "${GITHUB_OUTPUT}"
              exit 0
            }

            rg -o 'torch-[0-9][^"'"'"' <>]*\+corex\.[0-9.]+\.[0-9]{8}-cp312-cp312-linux_x86_64\.whl' /tmp/corex_wheel_index.html \
              | sort -u \
              | awk 'match($0, /\.[0-9]{8}-cp312-cp312-linux_x86_64\.whl$/) { d=substr($0, RSTART+1, 8); print d " " $0 }' \
              | sort -r > /tmp/corex_wheel_candidates.txt || true

            wheel_name=""
            for offset in 0 1 2 3 4 5 6; do
              target_date="$(date -u -d "${offset} day ago" +%Y%m%d)"
              candidate="$(awk -v d="${target_date}" '$1==d {print $2; exit}' /tmp/corex_wheel_candidates.txt || true)"
              if [[ -n "${candidate}" ]]; then
                wheel_name="${candidate}"
                echo "selected wheel date=${target_date} (offset=${offset}d): ${wheel_name}"
                break
              fi
            done

            if [[ -z "${wheel_name}" ]]; then
              echo "::warning::no stable wheel found for today or past 7 days under base URL: ${base_url}; fallback to previous successful image"
              echo "recent candidates:"
              head -n 20 /tmp/corex_wheel_candidates.txt || true
              echo "wheel_found=false" >> "${GITHUB_OUTPUT}"
              echo "fallback_reason=no_recent_wheel" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            wheel_url="${base_url}${wheel_name}"
          fi

          if [ -z "${wheel_name}" ]; then
            echo "::warning::failed to derive wheel filename from URL; fallback to previous successful image"
            echo "wheel_found=false" >> "${GITHUB_OUTPUT}"
            echo "fallback_reason=wheel_name_parse_failed" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          wheel_dir="${wheel_url%/*}/"
          md5sum_url="${wheel_dir}${wheel_name}.md5sum"

          retry_download "${wheel_url}" /tmp/corex_torch.whl || {
            echo "::warning::failed to download wheel: ${wheel_url}; fallback to previous successful image"
            echo "wheel_found=false" >> "${GITHUB_OUTPUT}"
            echo "fallback_reason=wheel_download_failed" >> "${GITHUB_OUTPUT}"
            exit 0
          }
          retry_download "${md5sum_url}" /tmp/corex_torch.whl.md5sum || {
            echo "::warning::.md5sum unavailable: ${md5sum_url}; fallback to previous successful image"
            echo "wheel_found=false" >> "${GITHUB_OUTPUT}"
            echo "fallback_reason=md5sum_unavailable" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          match_count="$(awk -v f="${wheel_name}" 'NF>=2 && $2==f {c++} END {print c+0}' /tmp/corex_torch.whl.md5sum)"
          if [ "${match_count}" -eq 0 ]; then
            echo "::warning::no md5 entry for ${wheel_name}; fallback to previous successful image"
            echo "wheel_found=false" >> "${GITHUB_OUTPUT}"
            echo "fallback_reason=md5_entry_missing" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${match_count}" -gt 1 ]; then
            echo "::warning::multiple md5 entries for ${wheel_name}; fallback to previous successful image"
            echo "wheel_found=false" >> "${GITHUB_OUTPUT}"
            echo "fallback_reason=md5_entry_multiple" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          wheel_md5="$(awk -v f="${wheel_name}" 'NF>=2 && $2==f {print $1}' /tmp/corex_torch.whl.md5sum)"
          if ! echo "${wheel_md5}  /tmp/corex_torch.whl" | md5sum -c -; then
            echo "::warning::md5 verification failed for ${wheel_name}; fallback to previous successful image"
            echo "wheel_found=false" >> "${GITHUB_OUTPUT}"
            echo "fallback_reason=md5_verify_failed" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          install -m 0644 /tmp/corex_torch.whl .github/docker/corex_torch.whl

          echo "wheel_found=true" >> "${GITHUB_OUTPUT}"
          echo "wheel_url=${wheel_url}" >> "${GITHUB_OUTPUT}"
          echo "wheel_md5=${wheel_md5}" >> "${GITHUB_OUTPUT}"
          echo "wheel_name=${wheel_name}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        if: ${{ steps.wheel.outputs.wheel_found == 'true' || steps.rebuild_mode.outputs.rebuild_with_prev_torch == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        if: ${{ steps.wheel.outputs.wheel_found == 'true' }}
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.iluvatar-ci
          push: true
          build-args: |
            COREX_TORCH_WHEEL_URL=${{ steps.wheel.outputs.wheel_url }}
            COREX_TORCH_WHEEL_MD5=${{ steps.wheel.outputs.wheel_md5 }}
            COREX_TORCH_WHEEL_NAME=${{ steps.wheel.outputs.wheel_name }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.TAG_INPUT != '' && env.TAG_INPUT || 'stable' }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}

      - name: Build and push image (retry once)
        id: build_retry
        if: ${{ steps.wheel.outputs.wheel_found == 'true' && steps.build.outcome == 'failure' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.iluvatar-ci
          push: true
          build-args: |
            COREX_TORCH_WHEEL_URL=${{ steps.wheel.outputs.wheel_url }}
            COREX_TORCH_WHEEL_MD5=${{ steps.wheel.outputs.wheel_md5 }}
            COREX_TORCH_WHEEL_NAME=${{ steps.wheel.outputs.wheel_name }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.TAG_INPUT != '' && env.TAG_INPUT || 'stable' }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}

      - name: Prepare placeholder wheel for fallback rebuild
        if: ${{ steps.wheel.outputs.wheel_found != 'true' && steps.rebuild_mode.outputs.rebuild_with_prev_torch == 'true' }}
        run: |
          : > .github/docker/corex_torch.whl

      - name: Validate previous image for fallback rebuild
        if: ${{ steps.wheel.outputs.wheel_found != 'true' && steps.rebuild_mode.outputs.rebuild_with_prev_torch == 'true' }}
        env:
          FALLBACK_IMAGE_REF: ${{ vars.CI_DEVICE_IMAGE_REF || '' }}
        run: |
          set -euo pipefail
          if [ -z "${FALLBACK_IMAGE_REF}" ]; then
            echo "::error::force rebuild requires CI_DEVICE_IMAGE_REF; cannot rebuild with previous torch"
            exit 1
          fi
          if [[ "${FALLBACK_IMAGE_REF}" != *@sha256:* ]]; then
            echo "::error::invalid CI_DEVICE_IMAGE_REF format: ${FALLBACK_IMAGE_REF}"
            exit 1
          fi
          if ! docker pull "${FALLBACK_IMAGE_REF}" >/dev/null; then
            echo "::error::unable to pull fallback base image: ${FALLBACK_IMAGE_REF}"
            exit 1
          fi

      - name: Build and push image (reuse previous torch)
        id: build_prev_torch
        if: ${{ steps.wheel.outputs.wheel_found != 'true' && steps.rebuild_mode.outputs.rebuild_with_prev_torch == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.iluvatar-ci
          push: true
          build-args: |
            BASE_IMAGE=${{ vars.CI_DEVICE_IMAGE_REF }}
            SKIP_COREX_TORCH_INSTALL=1
            COREX_TORCH_WHEEL_MD5=skip
            COREX_TORCH_WHEEL_NAME=skip.whl
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.TAG_INPUT != '' && env.TAG_INPUT || 'stable' }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}

      - name: Fallback to previous successful image
        id: fallback
        if: ${{ steps.wheel.outputs.wheel_found != 'true' && steps.rebuild_mode.outputs.rebuild_with_prev_torch != 'true' }}
        env:
          FALLBACK_IMAGE_REF: ${{ vars.CI_DEVICE_IMAGE_REF || '' }}
        run: |
          set -euo pipefail
          if [ -z "${FALLBACK_IMAGE_REF}" ]; then
            echo "::error::wheel unavailable and CI_DEVICE_IMAGE_REF is empty; cannot fallback"
            exit 1
          fi
          if [[ "${FALLBACK_IMAGE_REF}" != *@sha256:* ]]; then
            echo "::error::invalid CI_DEVICE_IMAGE_REF format: ${FALLBACK_IMAGE_REF}"
            exit 1
          fi
          fallback_digest="${FALLBACK_IMAGE_REF##*@}"
          echo "digest=${fallback_digest}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${FALLBACK_IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Print digest summary
        run: |
          {
            digest="${{ steps.build.outputs.digest != '' && steps.build.outputs.digest || steps.build_retry.outputs.digest != '' && steps.build_retry.outputs.digest || steps.build_prev_torch.outputs.digest != '' && steps.build_prev_torch.outputs.digest || steps.fallback.outputs.digest }}"
            if [ -z "${digest}" ]; then
              echo "::error::missing image digest from build step(s)"
              exit 1
            fi
            echo "### Iluvatar CI image published"
            echo ""
            echo "- image: \`${{ steps.meta.outputs.image }}\`"
            echo "- tag: \`${{ env.TAG_INPUT != '' && env.TAG_INPUT || 'stable' }}\`"
            echo "- reason: \`${{ env.REASON_INPUT != '' && env.REASON_INPUT || 'scheduled publish (02:00 CST) or manual dispatch' }}\`"
            if [ "${{ steps.wheel.outputs.wheel_found }}" = "true" ]; then
              echo "- wheel: \`${{ steps.wheel.outputs.wheel_url }}\`"
              echo "- wheel md5: \`${{ steps.wheel.outputs.wheel_md5 }}\`"
              echo "- digest: \`${digest}\`"
              echo "- immutable ref: \`${{ steps.meta.outputs.image }}@${digest}\`"
            elif [ "${{ steps.rebuild_mode.outputs.rebuild_with_prev_torch }}" = "true" ]; then
              echo "- warning: no latest wheel found from URL; image rebuilt with previous torch"
              echo "- fallback reason: \`${{ steps.wheel.outputs.fallback_reason != '' && steps.wheel.outputs.fallback_reason || 'wheel_unavailable' }}\`"
              echo "- force rebuild: \`${{ steps.rebuild_mode.outputs.force_rebuild }}\`"
              echo "- base image ref: \`${{ vars.CI_DEVICE_IMAGE_REF || '' }}\`"
              echo "- digest: \`${digest}\`"
              echo "- immutable ref: \`${{ steps.meta.outputs.image }}@${digest}\`"
            else
              echo "- warning: no latest wheel found from URL; fallback to previous successful image"
              echo "- fallback reason: \`${{ steps.wheel.outputs.fallback_reason != '' && steps.wheel.outputs.fallback_reason || 'wheel_unavailable' }}\`"
              echo "- fallback image ref: \`${{ steps.fallback.outputs.image_ref }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update repository variable CI_DEVICE_IMAGE_REF
        if: ${{ (env.TAG_INPUT == '' || env.TAG_INPUT == 'stable') && (steps.wheel.outputs.wheel_found == 'true' || steps.build_prev_torch.outputs.digest != '') }}
        env:
          GH_TOKEN: ${{ secrets.CI_VAR_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest != '' && steps.build.outputs.digest || steps.build_retry.outputs.digest != '' && steps.build_retry.outputs.digest || steps.build_prev_torch.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::missing digest; cannot update CI_DEVICE_IMAGE_REF"
            exit 1
          fi
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::CI_VAR_TOKEN is empty; skip CI_DEVICE_IMAGE_REF update"
            {
              echo "- CI_DEVICE_IMAGE_REF: skipped (CI_VAR_TOKEN missing)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          image = os.environ["IMAGE"]
          digest = os.environ["DIGEST"]
          value = f"{image}@{digest}"
          name = "CI_DEVICE_IMAGE_REF"
          api_base = f"https://api.github.com/repos/{repo}/actions/variables"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, url: str, payload: dict | None = None) -> tuple[int, str]:
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url=url, method=method, data=body, headers=headers)
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, resp.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", errors="replace")

          status, body = request("PATCH", f"{api_base}/{name}", {"name": name, "value": value})
          created = False
          if status == 404:
              status, body = request("POST", api_base, {"name": name, "value": value})
              created = status in (200, 201)
              if not created:
                  raise SystemExit(f"failed to create repo variable {name}: status={status} body={body}")
          elif status not in (200, 204):
              raise SystemExit(f"failed to update repo variable {name}: status={status} body={body}")

          mode = "created" if created else "updated"
          print(f"{mode} repo variable {name}={value}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"- CI_DEVICE_IMAGE_REF: `{value}` ({mode})\n")
          PY

      - name: Skip repository variable update for non-stable tag
        if: ${{ env.TAG_INPUT != '' && env.TAG_INPUT != 'stable' }}
        run: |
          echo "Skip CI_DEVICE_IMAGE_REF update for non-stable tag: ${{ env.TAG_INPUT }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup staged wheel artifact
        if: ${{ always() }}
        run: rm -f .github/docker/corex_torch.whl
