name: ix-toolchain-daily-refresh

# Host (Ubuntu 24.04): incremental working IXCC/IXSDK via sw_home/build.sh.
# u2004: incremental release IXCC inside the Ubuntu 20.04 image (glibc 2.31),
# default python 3.12 at ixcc-release-u2004-cp312. Separate trees per Python tag.

on:
  schedule:
    # 03:00 Asia/Shanghai == 19:00 UTC (previous day)
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      abi:
        description: "host = 24.04 working tree; u2004 = 20.04 docker release tree (default py3.12)"
        required: false
        type: choice
        options:
          - host
          - u2004
          - both
        default: host
      u2004_python_version:
        description: "Python tag for u2004 ixcc-release tree (3.10 or 3.12)"
        required: false
        type: choice
        options:
          - "3.12"
          - "3.10"
        default: "3.12"
      force_rebuild:
        description: "Force rebuild even if stamp already matches"
        required: false
        type: boolean
        default: false
      reason:
        description: "Why manual run is requested"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ix-toolchain-daily-refresh
  cancel-in-progress: false

jobs:
  refresh-host:
    name: refresh-ixcc-ixsdk-working
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.abi == 'host' || inputs.abi == 'both' }}
    runs-on: [self-hosted, linux, x64, gpu-iluvatar]
    timeout-minutes: 240
    env:
      IXCC_WORKING_ROOT: ${{ vars.IXCC_WORKING_ROOT || '/home/flydsl/sw_home/sdk/ixcc' }}
      IXSDK_WORKING_ROOT: ${{ vars.IXSDK_WORKING_ROOT || '/home/flydsl/sw_home/sdk/ixsdk' }}
      IX_TOOLCHAIN_DAILY_STATE_FILE: ${{ vars.IX_TOOLCHAIN_DAILY_STATE_FILE || '/var/tmp/flydsl-ix-toolchain-daily.state' }}
      IXCC_BUILD_MARKER: ${{ vars.IXCC_BUILD_MARKER || '' }}
      IXSDK_INSTALL_MARKER: ${{ vars.IXSDK_INSTALL_MARKER || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Daily update IXCC/IXSDK from working
        id: refresh
        run: |
          extra_args=()
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || 'false' }}" == "true" ]]; then
            extra_args+=(--force-rebuild)
          fi
          bash .github/scripts/prepare_ix_toolchains_daily.sh \
            --ixcc-root "${IXCC_WORKING_ROOT}" \
            --ixsdk-root "${IXSDK_WORKING_ROOT}" \
            --state-file "${IX_TOOLCHAIN_DAILY_STATE_FILE}" \
            "${extra_args[@]}"

      - name: Write summary
        env:
          INPUT_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || '' }}
        run: |
          {
            echo "### IX toolchain daily refresh (host / 24.04)"
            echo ""
            echo "- ixcc_commit: \`${{ steps.refresh.outputs.ixcc_commit || 'unknown' }}\`"
            echo "- ixsdk_commit: \`${{ steps.refresh.outputs.ixsdk_commit || 'unknown' }}\`"
            echo "- updated_today: \`${{ steps.refresh.outputs.updated_today || 'false' }}\`"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "- abi: \`${{ inputs.abi }}\`"
              echo "- manual reason: \`${INPUT_REASON}\`"
              echo "- force_rebuild: \`${{ inputs.force_rebuild }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  refresh-u2004:
    name: refresh-ixcc-release-u2004
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.abi == 'u2004' || inputs.abi == 'both' }}
    runs-on: [self-hosted, linux, x64, gpu-iluvatar]
    timeout-minutes: 360
    env:
      U2004_IMAGE: ${{ vars.FLYDSL_ILUVATAR_U2004_IMAGE || '10.150.9.98:80/infra/corex_base/ubuntu:20.04-latest' }}
      IXCC_WORKING_ROOT: ${{ vars.IXCC_WORKING_ROOT }}
      SW_HOME: ${{ vars.SW_HOME || '/home/flydsl/sw_home' }}
      COREX_ROOT: ${{ vars.COREX_ROOT }}
      U2004_PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.u2004_python_version || '3.12' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Incremental IXCC release build in Ubuntu 20.04
        id: build
        run: |
          set -euo pipefail
          ver="${U2004_PYTHON_VERSION}"
          ixcc_root="${SW_HOME}/sdk/ixcc-release-u2004-cp${ver//./}"
          extra=()
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || 'false' }}" == "true" ]]; then
            extra+=(--force-rebuild)
          fi
          # shellcheck disable=SC1091
          source .github/scripts/u2004_conda_python.sh
          bash .github/scripts/prepare_ix_toolchain_release.sh \
            --docker-image "${U2004_IMAGE}" \
            --python-version "${ver}" \
            --ixcc-release-root "${ixcc_root}" \
            "${extra[@]}"

      - name: Write summary
        env:
          U2004_PYTHON_VERSION: ${{ env.U2004_PYTHON_VERSION }}
        run: |
          cp_tag="${U2004_PYTHON_VERSION//./}"
          {
            echo "### IX toolchain daily refresh (u2004)"
            echo
            echo "- commit: \`${{ steps.build.outputs.ixcc_commit || 'unknown' }}\`"
            echo "- python: \`${U2004_PYTHON_VERSION}\`"
            echo "- image: \`${{ env.U2004_IMAGE }}\`"
            echo "- mlir cmake: \`${{ steps.build.outputs.mlir_cmake || 'unknown' }}\`"
            echo "- Set \`vars.IXCC_RELEASE_U2004_CP${cp_tag}_MLIR_CMAKE\` to the mlir cmake dir above."
          } >> "${GITHUB_STEP_SUMMARY}"
